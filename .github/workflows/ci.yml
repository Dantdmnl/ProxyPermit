name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  workflow:
    name: Workflow definitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

  quality:
    name: Python quality & version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/base.txt pylint==4.1.3 pyright==1.1.414
      - run: python scripts/check.py --only quality types version shell
      - name: Validate installation and server plans
        run: |
          python scripts/deploy/install.py --root "$(mktemp -d)"
          python -m app.runtime.server --check

  unit:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.12', '3.14']
        include:
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/base.txt
      - if: matrix.os != 'ubuntu-latest' || matrix.python != '3.14'
        run: python scripts/dev/test.py
      - name: Tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m pip install coverage==7.17.2
          python -m coverage run scripts/dev/test.py
          python -m coverage xml -o artifacts/coverage.xml
          python -m coverage report >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        with:
          name: coverage
          path: artifacts/coverage.xml
          retention-days: 14

  frontend:
    name: JavaScript, locales & browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python scripts/check.py --only frontend
      - name: Verify layout and account flows in Chromium
        run: |
          python -m pip install -r requirements/base.txt
          npm install --prefix "$RUNNER_TEMP/proxypermit-browser" --no-audit --no-fund playwright@1.65.0
          node "$RUNNER_TEMP/proxypermit-browser/node_modules/playwright/cli.js" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/proxypermit-browser/node_modules" PP_TEST_PYTHON="$(command -v python)" node tests/browser/settings.cjs

  http:
    name: Real HTTP / ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        server: [gunicorn, granian]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install -r requirements/granian.txt
      - run: python scripts/dev/check_server.py --backend '${{ matrix.server }}'

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements/granian.txt

  release:
    name: Release archive & tag validation
    needs: [workflow, quality, unit, frontend, http, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Match a pushed tag to VERSION
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py check --tag "$RELEASE_TAG"
      - run: python scripts/release.py archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-release
          path: dist/*
          retention-days: 14
