name: Publish release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable version tag to publish
        required: true
        type: string
      ci_run_id:
        description: Successful ProxyPermit CI push run for this exact tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify tag, CI result, manifest and checksums before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: python scripts/release.py publish --tag "$RELEASE_TAG" --run-id "$CI_RUN_ID"
