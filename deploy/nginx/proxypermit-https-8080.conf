# ProxyPermit Nginx config (HTTPS on port 8080)
#
# Usage:
# 1) Copy this file to /etc/nginx/sites-available/proxypermit.conf
# 2) Adjust server_name and certificate paths
# 3) Adjust allowed peer IPs in /api/sync/
# 4) Enable site + reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.local;
    return 301 https://$host:8080$request_uri;
}

server {
    listen 8080 ssl http2;
    listen [::]:8080 ssl http2;
    server_name proxy.example.local;

    # TLS certificate (Let's Encrypt example)
    ssl_certificate /etc/letsencrypt/live/proxy.example.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.example.local/privkey.pem;

    # Recommended TLS settings
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Optional hardening
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # UI gebruikt deze endpoint voor sync-status; laat deze door voor ingelogde webgebruikers.
    location = /api/sync/status {
        proxy_pass http://unix:/run/proxypermit/gunicorn.sock;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # UI gebruikt deze endpoint voor peer-status; laat deze door voor ingelogde webgebruikers.
    location = /api/sync/peer-status {
        proxy_pass http://unix:/run/proxypermit/gunicorn.sock;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Alleen node-to-node sync endpoints IP-beperken; UI sync endpoints lopen via app-auth.
    location ~ ^/api/sync/(download|upload|info|set-conflict|clear-conflict)$ {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.11.10;
        allow 172.16.11.11;
        deny all;

        proxy_pass http://unix:/run/proxypermit/gunicorn.sock;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://unix:/run/proxypermit/gunicorn.sock;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
